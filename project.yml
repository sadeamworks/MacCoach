name: MacCoach
options:
  bundleIdPrefix: com.sadeam
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  MacCoach:
    type: application
    platform: macOS
    sources:
      - path: MacCoach
    resources:
      - path: MacCoach/Resources/Assets.xcassets
      - path: MacCoach/Resources/Content/lessons.json
      - path: MacCoach/Resources/Content/shortcuts.json
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: true
        INFOPLIST_KEY_CFBundleDisplayName: "Mac Coach"
        CODE_SIGN_ENTITLEMENTS: MacCoach/Resources/MacCoach.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sadeam.maccoach
        GENERATE_INFOPLIST_FILE: true
    entitlements:
      path: MacCoach/Resources/MacCoach.entitlements
      properties:
        com.apple.security.app-sandbox: true

  MacCoachTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacCoachTests
    dependencies:
      - target: MacCoach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sadeam.maccoach.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacCoach.app/Contents/MacOS/MacCoach"
        BUNDLE_LOADER: "$(TEST_HOST)"
